[project]
name = "lvhm"
version = "0.1.0"
description = "RL job sequencing for a low-volume high-mix SO-ARM101 work cell (43008 Assignment 3)"
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.0",
    "numpy>=2.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lvhm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
