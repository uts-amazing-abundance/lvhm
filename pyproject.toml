[project]
name = "lvhm"
version = "0.1.0"
description = "RL job sequencing for a low-volume high-mix SO-ARM101 work cell (43008 Assignment 3)"
requires-python = ">=3.12"
# Loose lower bounds so `pip install -e .` keeps a preinstalled CUDA build of torch
dependencies = [
    "gymnasium>=1.0",
    "numpy>=1.26",
    "sb3-contrib>=2.4",
    "torch>=2.2",
]

[project.optional-dependencies]
notebook = [
    "ipykernel>=6.0",
    "matplotlib>=3.7",
    "pandas>=2.0",
]

[dependency-groups]
dev = ["pytest>=8"]
sim = [
    "mujoco>=3.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lvhm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
